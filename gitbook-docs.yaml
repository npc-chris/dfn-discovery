$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: DFN Discovery
  structure:
    - type: section
      key: section-general
      title: General
      path: general
      description: General overview, system boundaries, and architectural principles.
      default: true
      children:
        - type: space
          key: space-general-overview
          title: Overview
          path: overview
          default: true
          content:
            directory: ./docs/general/overview
        - type: space
          key: space-general-architecture
          title: Architecture
          path: architecture
          content:
            directory: ./docs/general/architecture
        - type: space
          key: space-general-development
          title: Development Guides
          path: development
          content:
            directory: ./docs/general/development
        - type: space
          key: space-general-operations
          title: Operations
          path: operations
          content:
            directory: ./docs/general/operations
    - type: section
      key: section-services
      title: Services & Logic
      path: services
      description: Core backend services, API routes, endpoints, and business logic.
      children:
        - type: space
          key: space-services-logic
          title: Services & Logic
          path: logic
          default: true
          content:
            directory: ./docs/services/logic
        - type: space
          key: space-services-routes
          title: Routes & Endpoints
          path: routes
          content:
            directory: ./docs/services/routes
        - type: space
          key: space-services-workers
          title: Workers & Queue
          path: workers
          content:
            directory: ./docs/services/workers
        - type: space
          key: space-services-db
          title: Database & Schema
          path: database
          content:
            directory: ./docs/services/database
    - type: section
      key: section-docs
      title: Documentation
      path: docs
      description: Repository-wide architecture, planning, and high-level specifications.
      children:
        - type: space
          key: space-docs
          title: Repository Docs
          path: repository
          default: true
          content:
            directory: ./docs

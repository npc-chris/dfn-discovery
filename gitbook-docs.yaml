$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: DFN Discovery
  structure:
    - type: section
      key: section-docs
      title: Documentation
      path: docs
      description: Repository-wide architecture, planning, and high-level specifications.
      default: true
      children:
        - type: space
          key: space-docs-overview
          title: Repository Overview
          path: overview
          default: true
          content:
            directory: ./docs
    - type: section
      key: section-backend
      title: Backend
      path: backend
      description: Backend service boundaries, architecture, development guides, and operations.
      children:
        - type: space
          key: space-backend-overview
          title: Overview
          path: overview
          default: true
          content:
            directory: null
        - type: space
          key: space-backend-architecture
          title: Architecture
          path: architecture
          content:
            directory: null
        - type: space
          key: space-backend-development
          title: Development Guides
          path: development
          content:
            directory: null
        - type: space
          key: space-backend-operations
          title: Operations
          path: operations
          content:
            directory: null

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dfn-postgres
    environment:
      POSTGRES_DB: dfn_discovery
      POSTGRES_USER: dfn_user
      POSTGRES_PASSWORD: dfn_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfn_user -d dfn_discovery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dfn-network

  redis:
    image: redis:7-alpine
    container_name: dfn-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dfn-network

volumes:
  postgres_data:

networks:
  dfn-network:
    driver: bridge
